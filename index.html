<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitta Praktik - Login</title>
  <!-- CSS -->
  <link rel="stylesheet" href="/css/style.css" />
  <!-- JSON -->
  <script src="/js/data.js"></script>
  <!-- JAVASCRIPT -->
  <script src="/js/login.js"></script>
</head>
<body>

  <main class="min-h-screen flex items-center justify-center">
    <form id="formLogin" class="border p-8 rounded-md shadow">
      <div class="py-2 text-xl font-bold text-center">Selamat Datang</div>
      <div class="flex flex-col p-2">
        <label for="email" class="py-2 font-bold uppercase">email</label>
        <input id="email" type="text" name="email" placeholder="Masukkan email anda" class="p-2 rounded border">
      </div>
      <div class="flex flex-col p-2">
        <label for="password" class="py-2 font-bold uppercase">password</label>
        <input id="password" type="password" name="password" placeholder="Masukkan password anda" class="p-2 rounded border">
      </div>
      <div class="flex justify-end">
        <a id ="lupa" href="/forgot" class="text-sm">Lupa password?</a>
      </div>
      <div class="flex flex-col py-2">
        <button type="submit" class="p-2 rounded bg-orange-500">masuk</button>
        <div class="flex justify-end">
          <a id ="daftar" href="/register" class="text-sm">Belum punya akun?</a>
        </div>
      </div>
    </form>
  </main>

  <!-- Modal -->
  <div id="myModal" class="modal">
    <!-- Modal content -->
    <div class="modal-content">
      <span class="close">&times;</span>
      <p id="ModalMessage"></p>
    </div>
  </div>

  <div id="lupaPassword" class="modal">
    <!-- Modal content -->
    <div class="modal-content-sm">
      <div class="flex justify-between items-center">
        <strong>FORM LUPA PASSWORD</strong>
        <span class="close">&times;</span>
      </div>
      <form id="formLupaPassword">
        <div class="flex flex-col">
          <label for="lupa-email" class="py-2 font-bold uppercase">Email</label>
          <input id="lupa-email" type="email" name="email" placeholder="Masukkan password anda" class="p-2 rounded border">
        </div>
        <div class="flex justify-center py-2">
          <button class="bg-orange-500 py-2 px-4 rounded" type=""submit>submit</button>
        </div>
      </form>
    </div>
  </div>

  <div id="register" class="modal">
    <!-- Modal content -->
    <div class="modal-content-sm">
      <div class="flex justify-between items-center">
        <strong>FORM REGISTER</strong>
        <span class="close">&times;</span>
      </div>
      <form id="formRegister" class="mt-4">
        <div class="flex flex-col">
          <label for="register-nama" class="py-2 font-bold uppercase">Nama</label>
          <input required id="register-nama" type="text" name="nama" placeholder="Masukkan nama anda" class="p-2 rounded border">
        </div>
        <div class="flex flex-col">
          <label for="register-email" class="py-2 font-bold uppercase">Email</label>
          <input required id="register-email" type="email" name="email" placeholder="Masukkan password anda" class="p-2 rounded border">
        </div>
        <div class="flex flex-col">
          <label for="register-password" class="py-2 font-bold uppercase">Password</label>
          <input required id="register-password" type="password" name="pasword" placeholder="Password" class="p-2 rounded border">
        </div>
        <div class="flex flex-col">
          <label for="register-role" class="py-2 font-bold uppercase">Role</label>
          <input required id="register-role" type="text" name="role" placeholder="UPBJJ-UT" class="p-2 rounded border">
        </div>
        <div class="flex flex-col">
          <label for="register-lokasi" class="py-2 font-bold uppercase">Lokasi</label>
          <input required id="register-lokasi" type="text" name="lokasi" placeholder="UPBJJ-Jakarta" class="p-2 rounded border">
        </div>
        <div class="flex justify-center py-2">
          <button class="bg-orange-500 py-2 px-4 rounded" type=""submit>submit</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
